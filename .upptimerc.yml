# Escaparate público de beloq — status.beloq.es
#
# Los cuatro indicadores hablan en cristiano (nada de "MQTT", "broker" ni
# "backend": un usuario no tiene por qué saber cómo está hecho por dentro) y
# se calculan desde el MISMO canal que alimenta el mapa de la app, no con
# pings a la infraestructura. El día que caducaron tres certificados, los
# pings seguían verdes con media flota fuera: eso es lo que esto arregla.
#
# Las direcciones del sistema viven en el secreto SECRET_SITE del repo: no se
# publican aquí ni en el historial (Upptime las redacta).
owner: beloq
repo: beloq-status

sites:
  - name: Sistema beloq
    url: $SECRET_SITE/health/sistema
  - name: Sistema de telecomunicaciones entre beloqs
    url: $SECRET_SITE/health/telecomunicaciones
  - name: Red de beloqs
    url: $SECRET_SITE/health/red
  # Comprobación externa a propósito: no depende de nuestro sistema, así que
  # sigue avisando aunque el sistema esté caído.
  - name: Servicios web y app
    url: https://m.beloq.es/

status-website:
  cname: status.beloq.es
  name: Estado de beloq
  introTitle: "Estado de **beloq** en tiempo real"
  introMessage: Aquí puedes comprobar si nuestros servicios funcionan con normalidad y cuántos beloqs están operativos. Si hay una incidencia en curso aparecerá abajo, con lo que ha pasado y cuándo esperamos resolverla.
  navbar:
    - title: Estado
      href: /
    - title: beloq.es
      href: https://beloq.es

assignees:
  - beloq

i18n:
  activeIncidents: Incidencias activas
  allSystemsOperational: Todo funciona con normalidad
  incidentReport: "Incidencia #$NUMBER"
  incidentTitle: "Detalles de la incidencia #$NUMBER"
  incidentDetails: Detalles de la incidencia
  incidentFixed: Resuelta
  incidentOngoing: En curso
  liveStatus: Estado en vivo
  overallUptime: "Disponibilidad total: $UPTIME"
  averageResponseTime: "Tiempo de respuesta medio: $TIME ms"
  pastIncidents: Incidencias pasadas
  pastIncidentsResolved: "Resuelta en $MINUTES minutos"
  pageStatusUp: Todo operativo
  pageStatusDown: Hay una incidencia activa
  pageStatusDegraded: Rendimiento degradado
  up: Operativo
  down: Con incidencia
  degraded: Degradado
