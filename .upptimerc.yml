# Configuración de Upptime para la página de estado pública de beloq
# (plan de alertas 4-sep-2026). Los tres servicios vigilados ya son
# públicos por diseño: aquí solo se publica su disponibilidad.
owner: beloq
repo: beloq-status

sites:
  - name: API de beloq (backend)
    url: https://beloq-backend-z6zijzweeq-no.a.run.app/
  - name: Broker MQTT (estaciones)
    check: "tcp-ping"
    url: mqtt.beloq.es
    port: 8883
  - name: Web NFC (m.beloq.es)
    url: https://m.beloq.es/

status-website:
  cname: status.beloq.es
  name: Estado de beloq
  introTitle: "Estado de los sistemas de **beloq** en tiempo real"
  introMessage: Aquí puedes comprobar si nuestros servicios funcionan con normalidad. Si hay una incidencia en curso aparecerá abajo, con actualizaciones y tiempo estimado de resolución.
  navbar:
    - title: Estado
      href: /
    - title: beloq.es
      href: https://beloq.es

# Los incidentes se asignan a la cuenta de la organización
assignees:
  - beloq

i18n:
  activeIncidents: Incidencias activas
  allSystemsOperational: Todos los sistemas funcionan con normalidad
  incidentReport: "Incidencia #$NUMBER"
  incidentTitle: "Detalles de la incidencia #$NUMBER"
  incidentDetails: Detalles de la incidencia
  incidentFixed: Resuelta
  incidentOngoing: En curso
  liveStatus: Estado en vivo
  overallUptime: "Disponibilidad total: $UPTIME"
  averageResponseTime: "Tiempo de respuesta medio: $TIME ms"
  pastIncidents: Incidencias pasadas
  pastIncidentsResolved: "Resuelta en $MINUTES minutos"
  pageStatusUp: Todo operativo
  pageStatusDown: Hay una incidencia activa
  pageStatusDegraded: Rendimiento degradado
  up: Operativo
  down: Caído
  degraded: Degradado
